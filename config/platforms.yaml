# 平台注册表：只有登记过的平台才能入库（未登记 = 拒收，防止新平台没配时区就混进来）
#
# source_tz  这个平台上报的 timestamp 是哪个时区的本地时间，属于采集契约。
# confirmed  source_tz 是否已经和采集方书面确认。false = 我们自己的假设：
#            查询照常返回，但当请求的 tz 与 source_tz 不同时，响应 meta.warnings 会带
#            SOURCE_TZ_UNCONFIRMED，提示换算可能引入整体偏移。
#
# 样例数据三个平台都没有确认过：小时分布集中在 07–22 点，像同一时区的本地营业时间，但不知道是哪个时区。
# 暂按 UTC 解析，等于「按时间戳上写的日期原样切日」。确认后改这里并重放 ingest 即可，
# raw 表保留了原始时间文本 ts_raw。
#
# 兼容旧写法 `app: UTC`：按 confirmed: false 处理。旧写法没有表达「确认过」这件事，
# 默认不确认只会多一条警告；默认确认则可能把一个猜出来的时区当成事实，静默算错。
platforms:
  app:         {source_tz: UTC, confirmed: false}
  marketplace: {source_tz: UTC, confirmed: false}
  website:     {source_tz: UTC, confirmed: false}

# 预设报表时区：为这些时区物化品类日表（查询走最便宜的 A 段）。
# Asia/Kolkata 是 +05:30 非整点时区的代表，小时表切不准，所以预先物化。
preset_timezones:
  - UTC
  - Asia/Shanghai
  - America/Los_Angeles
  - America/New_York
  - Europe/London
  - Asia/Kolkata
